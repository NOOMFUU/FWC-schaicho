<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Portfolio</title>
    <style>
      * {
        box-sizing: border-box;
        transition: all 0.2s;
      }
      body {
        padding: 50px;
        height: 100vh;
        background-image: url("images/bgloop.gif");
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
      }
      main {
        width: 100%;
        height: 100%;
        border: 5px solid;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #fff;
        border-radius:20px;
      }
      .welcome{
        text-align: center;
      }
      
      .box-select {
        display: flex;
        gap: 2em;
      }
      .card-person {
        position: relative;
        border: 3px solid black;
        padding: 15px 25px;
        border-radius: 50px;
        background-color: black;
        a{
            padding: 15px 25px;
            font-size: clamp(5px,5vw,26px);
            position: relative;
            z-index: 2;
            text-decoration: none;
            color:#000;
        }
        a:hover{
            color:#fff;
        }
      }
      .card-person::before {
        content: "";
        position: absolute;
        z-index: 1;
        top: 0px;
        left: 0px;
        width: 100%;
        height: 100%;
        border-radius: 50px;
        background-color: #fff;
      }

      .card-person:hover::before {
        animation: btnscaleDown 0.2s ;
        animation-fill-mode:forwards;
        
      }

     @media (max-width: 768px) {
        body{
          padding: 0px;
        }
        .box-select{
          display: block;
          
        }
        .card-person{ 
          margin-top: 10px;
        }
      }

      @keyframes btnscaleDown{
        0%{
            transform: scale(1);
        }
        100%{
            transform: scale(0);
            
        }
      }

    </style>
  </head>
  <body>
    <main>
      <h1 class="welcome">Welcome to Our Portfolio</h1>

      <h2>Select a Portfolio to View</h2>
      <div class="box-select">
        <div class="card-person">
          <a href="Person1.html"> nsrisook </a>
        </div>

        <div class="card-person">
          <a href="Person2.html"> schaicho </a>
        </div>
      </div>
    </main>
  </body>
</html>
