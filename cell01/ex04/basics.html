<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
        }
        
        h1 {
            color: white;
            text-align: center;
        }

        .shop-container {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-bottom: 20px;
        }

        .shop-item {
            text-align: center;
        }

        .shop-item img {
            width: auto;
            height: 200px;
        }

        .footer {
            text-align: right;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Welcome to Online Shops &hearts;</h1>
    
    <div class="shop-container">
        <div class="shop-item">
            <a href="https://amazon.com" target="_blank">
            <img src="https://static.vecteezy.com/system/resources/thumbnails/019/136/319/small/amazon-logo-amazon-icon-free-free-vector.jpg" alt="Shopee Logo">
            <br>
            Visit Amazon</a>
        </div>
        <div class="shop-item">
            <a href="https://thaimart.com/" target="_blank">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9jmBdF0QPjHdCFjGC6bKfOzBV0DHQOd--0Av2zHf5uuyE1N09XNH4MEA&s=10" alt="Lazada Logo">
            <br>
            Visit thaimart</a>
        </div>
    </div>
    <hr>
    
    <p class="footer">&copy; schaicho 2026</p>
</body>
</html>
