<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            height: 20vh;
        }
        td {
            border: 1px solid #000;
        }
        .box-left {
            background-color: #ff9999;
        }
        .box-right {
            background-color: #99ccff;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="box-left">First cell</th>
            <td class="box-right">Second cell</th>
        </tr>
    </table>
</body>
</html>
